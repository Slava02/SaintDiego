name: Deploy Application

on:
  push:
    branches:
      - main # Triggers on push to main branch
  workflow_dispatch: # Allows manual trigger

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Set permissions on start_all.sh
        run: chmod +x start_all.sh

      - name: Deploy to Server
        env:
          SERVER_USER: ${{ secrets.SSH_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Create deployment directory if it doesn't exist
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "mkdir -p $DEPLOY_PATH"

          # Copy files to server
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.github' \
            ./ $SERVER_USER@$SERVER_HOST:$DEPLOY_PATH

          # Deploy application
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "cd $DEPLOY_PATH && ./start_all.sh"

          # Verify deployment
          ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "docker ps | grep 'api\|saint_egidio_bot\|mks-db'"

# Required secrets (configure in GitHub):
# - SSH_PRIVATE_KEY: Private SSH key for server access
# - SERVER_HOST: Server address (IP or domain)
# - SSH_USER: SSH username
# - DEPLOY_PATH: Server path for deployment
