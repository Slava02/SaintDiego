[global]
name = "api-gateway"
env = "dev"

[log]
level = "debug"

[servers.apiGW]
addr = ":8080"

[services.schedule]
addr = ":50051"

[services.services]
addr = ":50052"

[services.events]
addr = ":50053"

[services.volunteers]
addr = ":50054"

[services.clients]
addr = ":50055"

[services.auth]
addr = ":50056"

[servers.apiGW.jwt]
secret = "secret"
