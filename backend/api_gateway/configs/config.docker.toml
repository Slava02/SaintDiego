[global]
name = "api-gateway"
env = "dev"

[log]
level = "debug"

[servers.apiGW]
addr = "0.0.0.0:8080"

[services.schedule]
addr = "host.docker.internal:50051"

[services.services]
addr = "host.docker.internal:50052"

[services.events]
addr = "host.docker.internal:50053"

[services.volunteers]
addr = "host.docker.internal:50054"

[services.clients]
addr = "host.docker.internal:50055"

[services.auth]
addr = "host.docker.internal:50056"

[servers.apiGW.jwt]
secret = "secret"
