components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Location:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
      required:
        - id
        - name
      example:
        id: 1
        name: Главный храм
        address: ул. Примерная, 123
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: string
      required:
        - code
        - message
      example:
        code: VALIDATION_ERROR
        message: Ошибка валидации
        details: Поле 'name' обязательно для заполнения
    CreateLocationRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
      required:
        - name
        - address
      example:
        name: Новый храм
        address: ул. Новая, 67
    UpdateLocationRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
      required:
        - name
        - address
      example:
        name: Новый храм
        address: ул. Новая, 67
    ServiceType:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        min_period_days:
          type: integer
          format: int32
        registration_available:
          type: boolean
      required:
        - id
        - name
        - min_period_days
        - registration_available
      example:
        id: 1
        name: Исповедь
        min_period_days: 1
        registration_available: true
    GetServicesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceType'
        total:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        per_page:
          type: integer
          format: int32
        total_pages:
          type: integer
          format: int32
      required:
        - items
        - total
        - page
        - per_page
        - total_pages
    UpdateServiceRegistrationRequest:
      type: object
      properties:
        min_period_days:
          type: integer
          format: int32
        registration_available:
          type: boolean
      required:
        - min_period_days
        - registration_available
      example:
        min_period_days: 1
        registration_available: true
    TimeSlotService:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serviceTypeId:
          type: integer
          format: int64
        capacity:
          type: integer
          format: int32
        bookingWindow:
          type: integer
          format: int32
        time:
          type: string
          format: date-time
      required:
        - serviceTypeId
        - capacity
        - bookingWindow
        - time
      example:
        serviceTypeId: 1
        capacity: 20
        bookingWindow: 30
        time: '2024-03-20T09:00:00Z'
    Recurrence:
      type: object
      properties:
        frequency:
          type: string
          enum:
            - daily
            - weekly
            - monthly
        interval:
          type: integer
          format: int32
          minimum: 1
        endType:
          type: string
          enum:
            - never
            - date
        endValue:
          type: string
          format: date-time
          nullable: true
      required:
        - frequency
        - interval
        - endType
      example:
        frequency: weekly
        interval: 1
        endType: date
        endValue: '2024-04-20T19:00:00Z'
    TimeSlot:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        type:
          type: string
          enum:
            - single
            - recurring
        locationId:
          type: integer
          format: int64
        capacity:
          type: integer
          format: int32
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - active
            - archived
        services:
          type: array
          items:
            $ref: '#/components/schemas/TimeSlotService'
        recurrence:
          $ref: '#/components/schemas/Recurrence'
      required:
        - id
        - title
        - type
        - locationId
        - capacity
        - startDate
        - endDate
        - status
        - services
      example:
        id: 1
        title: Утренняя служба
        type: single
        locationId: 1
        capacity: 50
        startDate: '2024-03-20T09:00:00Z'
        endDate: '2024-03-20T10:00:00Z'
        status: active
        services:
          - timeSlotId: 1
            serviceTypeId: 1
            capacity: 20
            bookingWindow: 30
            time: '2024-03-20T09:00:00Z'
          - timeSlotId: 1
            serviceTypeId: 2
            capacity: 30
            bookingWindow: 30
            time: '2024-03-20T09:30:00Z'
    CreateTimeSlotRequest:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
          enum:
            - single
            - recurring
        locationId:
          type: integer
          format: int64
        capacity:
          type: integer
          format: int32
        startDate:
          type: string
          format: date-time
          x-validate:
            - rule: startDate must be in the future
              condition: startDate > now
            - rule: startDate must be before endDate
              condition: startDate < endDate
        endDate:
          type: string
          format: date-time
          x-validate:
            - rule: endDate must be after startDate
              condition: endDate > startDate
        services:
          type: array
          items:
            $ref: '#/components/schemas/TimeSlotService'
        recurrence:
          $ref: '#/components/schemas/Recurrence'
      required:
        - title
        - type
        - locationId
        - capacity
        - startDate
        - endDate
        - services
      example:
        title: Тест повторение
        type: recurring
        locationId: 1
        capacity: 100
        startDate: '2025-03-20T18:00:00Z'
        endDate: '2025-03-20T19:00:00Z'
        services:
          - serviceTypeId: 1
            capacity: 40
            bookingWindow: 30
            time: '2025-03-20T18:00:00Z'
          - serviceTypeId: 2
            capacity: 60
            bookingWindow: 30
            time: '2025-03-20T18:30:00Z'
        recurrence:
          frequency: weekly
          interval: 1
          endType: date
          endValue: '2025-04-20T19:00:00Z'
    Event:
      type: object
      properties:
        id:
          type: integer
          format: int64
        timeSlotServiceId:
          type: integer
          format: int64
        serviceTypeId:
          type: integer
          format: int64
        serviceName:
          type: string
        capacity:
          type: integer
          format: int32
        datetime:
          type: string
          format: date-time
        participantsCount:
          type: integer
          format: int32
      required:
        - timeSlotServiceId
        - capacity
        - datetime
        - serviceTypeId
        - id
        - serviceName
        - participantsCount
      example:
        id: 1
        timeSlotServiceId: 1
        capacity: 20
        datetime: '2024-03-20T09:00:00Z'
        participantsCount: 10
    GetEventsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        total:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        per_page:
          type: integer
          format: int32
        total_pages:
          type: integer
          format: int32
      required:
        - items
        - total
        - page
        - per_page
        - total_pages
      example:
        items:
          - id: 1
            timeSlotServiceId: 1
            capacity: 20
            datetime: '2024-03-20T09:00:00Z'
          - id: 2
            timeSlotServiceId: 2
            capacity: 20
            datetime: '2024-03-20T09:00:00Z'
        total: 100
        page: 1
        per_page: 10
        total_pages: 10
    UpdateEventRequest:
      type: object
      properties:
        capacity:
          type: integer
          format: int32
        datetime:
          type: string
          format: date-time
      required:
        - capacity
        - datetime
      example:
        capacity: 20
        datetime: '2024-03-20T09:00:00Z'
    Participant:
      type: object
      properties:
        id:
          type: integer
          format: int64
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        birth_date:
          type: string
          format: date-time
        volunteer_tg:
          type: integer
          format: int64
        volunteer_tg_login:
          type: string
        volounteer_first_name:
          type: string
        volounteer_middle_name:
          type: string
        volounteer_last_name:
          type: string
        photo_name:
          type: string
      required:
        - id
        - first_name
        - middle_name
        - last_name
        - volunteer_tg
        - volunteer_tg_login
        - volounteer_first_name
        - volounteer_middle_name
        - volounteer_last_name
      example:
        id: 1
        first_name: Иван
        middle_name: Иванович
        last_name: Иванов
        birth_date: '2024-03-20T09:00:00Z'
        volunteer_tg: 1
        volunteer_tg_login: ivan_ivanov
        volounteer_first_name: Иван
        volounteer_middle_name: Иванович
        volounteer_last_name: Иванов
        photo_name: photo.jpg
    GetParticipantsResponse:
      type: object
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        total:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        per_page:
          type: integer
          format: int32
        total_pages:
          type: integer
          format: int32
      required:
        - participants
        - total
        - page
        - per_page
        - total_pages
    AddParticipantToEventRequest:
      type: object
      properties:
        participant_id:
          type: integer
          format: int64
        volunteer_id:
          type: integer
          format: int64
      required:
        - participant_id
        - volunteer_id
      example:
        participant_id: 1
        volunteer_id: 2
    Client:
      type: object
      properties:
        id:
          type: integer
          format: int64
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        is_homeless:
          type: boolean
        photo_name:
          type: string
        birth_date:
          type: string
          format: date-time
        gender:
          type: integer
          format: int32
        is_new:
          type: boolean
        is_blocked:
          type: boolean
        blocked_at:
