            $ref: '#/components/schemas/Client'
        total:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        per_page:
          type: integer
          format: int32
        total_pages:
          type: integer
          format: int32
      required:
        - clients
        - total
        - page
        - per_page
        - total_pages
      example:
        clients:
          - id: 1
            first_name: Иван
            middle_name: Иванович
            last_name: Иванов
