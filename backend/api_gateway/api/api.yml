    CreateClientRequest:
      type: object
      properties:
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
      required:
        - first_name
        - middle_name
        - last_name
      example:
        first_name: Иван
        middle_name: Иванович
        last_name: Иванов
    BlockClientRequest:
      type: object
      properties:
        is_blocked:
          type: boolean
        block_reason:
          type: string
      required:
        - is_blocked
      example:
        is_blocked: true
        block_reason: test
    GetAvailableServicesResponse:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceType'
      required:
        - services
    Volunteer:
      type: object
      properties:
        tg_id:
          type: integer
          format: int64
        tg_login:
          type: string
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
      required:
        - tg_id
        - tg_login
        - first_name
        - middle_name
        - last_name
      example:
        tg_id: 1
        tg_login: test_volunteer
        first_name: Иван
        middle_name: Иванович
        last_name: Иванов
    UpdateVolunteerRequest:
      type: object
      properties:
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
      required:
        - first_name
        - middle_name
        - last_name
      example:
        first_name: Иван
        middle_name: Иванович
    LoginRequest:
      type: object
      properties:
        login:
          type: string
        password:
          type: string
      required:
        - login
