get:
  tags:
    - services
  summary: Получение списка услуг доступных для регистрации
  responses:
    '200':
      description: Успешный ответ
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/ServiceType.yml
            maxItems: 100
    '400':
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
