put:
  tags:
    - locations
  summary: Обновление локации по идентификатору
  parameters:
    - name: id
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        format: int64
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateLocationRequest.yml
    required: true
  responses:
    '200':
      description: Локация успешно обновлена
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Location.yml
    '400':
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
delete:
  tags:
    - locations
  summary: Удаление локации по идентификатору
  parameters:
    - name: id
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Локация успешно удалена
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
    '400':
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
