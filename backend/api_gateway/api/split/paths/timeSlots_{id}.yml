get:
  tags:
    - timeSlots
  summary: Получение временного слота по идентификатору
  parameters:
    - name: id
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Временной слот
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TimeSlot.yml
    '400':
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '401':
      description: Access denied
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
put:
  tags:
    - timeSlots
  summary: Обновление временного слота
  parameters:
    - name: id
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        format: int64
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/TimeSlot.yml
    required: true
  responses:
    '200':
      description: Временной слот успешно обновлен
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TimeSlot.yml
    '400':
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '401':
      description: Access denied
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
delete:
  tags:
    - timeSlots
  summary: Удаление временного слота
  parameters:
    - name: id
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Временной слот успешно удален
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
    '400':
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '401':
      description: Access denied
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
