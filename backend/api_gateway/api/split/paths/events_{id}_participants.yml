get:
  tags:
    - events
  summary: Получение списка участников события
  parameters:
    - name: id
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        format: int64
    - name: page
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    - name: per_page
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
  responses:
    "200":
      description: Успешный ответ
      content:
        application/json:
          schema:
            $ref: ../components/schemas/GetParticipantsResponse.yml
    "400":
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    "401":
      description: Access denied
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    "404":
      description: Событие не найдено
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
put:
  tags:
    - events
  summary: Добавление участника к событию
  parameters:
    - name: id
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        format: int64
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AddParticipantToEventRequest.yml
  responses:
    "204":
      description: Успешный ответ
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
    "400":
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    "401":
      description: Access denied
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    "404":
      description: Not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    "409":
      description: Not enough capacity
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    "422":
      description: Client already participant
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
