get:
  tags:
    - volunteers
  summary: Получение волонтера по идентификатору
  parameters:
    - name: tg_id
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Успешный ответ
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Volunteer.yml
    '400':
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
put:
  tags:
    - volunteers
  summary: Обновление волонтера
  parameters:
    - name: tg_id
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        format: int64
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateVolunteerRequest.yml
  responses:
    '200':
      description: Успешный ответ
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Volunteer.yml
    '400':
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
