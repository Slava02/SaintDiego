get:
  parameters:
    - name: page
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    - name: per_page
      in: query
      required: true
      schema:
        type: integer
  tags:
    - clients
  summary: Получение списка живых клиентов
  responses:
    '200':
      description: Успешный ответ
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/GetClientsResponse.yml
    '400':
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
post:
  tags:
    - clients
  summary: Создание нового клиента
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateClientRequest.yml
  responses:
    '201':
      description: Успешный ответ
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Client.yml
    '400':
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
