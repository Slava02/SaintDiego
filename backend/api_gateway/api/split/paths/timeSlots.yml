get:
  tags:
    - timeSlots
  summary: Получение списка временных слотов
  description: Возвращает список временных слотов с возможностью фильтрации
  parameters:
    - name: status
      in: query
      style: form
      explode: true
      schema:
        type: string
        enum:
          - active
          - archived
    - name: startDate
      in: query
      style: form
      explode: true
      schema:
        type: string
        format: date-time
    - name: endDate
      in: query
      style: form
      explode: true
      schema:
        type: string
        format: date-time
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/TimeSlot.yml
            maxItems: 100
    "400":
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
post:
  tags:
    - timeSlots
  summary: Создание нового временного слота
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateTimeSlotRequest.yml
    required: true
  responses:
    "201":
      description: Временной слот успешно создан
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TimeSlot.yml
    "400":
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
