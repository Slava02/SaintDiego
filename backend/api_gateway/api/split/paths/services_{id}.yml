get:
  tags:
    - services
  summary: Получение информации об услуге по идентификатору
  parameters:
    - name: id
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        format: int64
  responses:
    '200':
      description: Успешный ответ
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServiceType.yml
          example:
            id: 1
            name: Исповедь
    '400':
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '401':
      description: Access denied
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
put:
  tags:
    - services
  summary: Обновление информации об услуге по идентификатору
  parameters:
    - name: id
      in: path
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        format: int64
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateServiceRegistrationRequest.yml
    required: true
  responses:
    '200':
      description: Успешный ответ
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServiceType.yml
          example:
            id: 1
            name: Исповедь
    '400':
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '401':
      description: Access denied
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
