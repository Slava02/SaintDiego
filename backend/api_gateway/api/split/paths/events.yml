get:
  parameters:
    - name: page
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    - name: per_page
      in: query
      required: true
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    - name: participant_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
    - name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - upcoming
          - past
    - name: location_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
    - name: service_id
      in: query
      required: false
      schema:
        type: integer
        format: int64
    - name: from_date
      in: query
      required: false
      schema:
        type: string
        format: date-time
    - name: to_date
      in: query
      required: false
      schema:
        type: string
        format: date-time
  tags:
    - events
  summary: Получение списка событий
  responses:
    '200':
      description: Успешный ответ
      content:
        application/json:
          schema:
            $ref: ../components/schemas/GetEventsResponse.yml
    '400':
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '401':
      description: Access denied
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
