get:
  summary: Получение списка событий
  responses:
    '200':
      description: Успешный ответ
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Event.yml
    '400':
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
