type: object
properties:
  id:
    type: integer
    format: int64
  timeSlotServiceId:
    type: integer
    format: int64
  serviceTypeId:
    type: integer
    format: int64
  serviceName:
    type: string
  capacity:
    type: integer
    format: int32
  datetime:
    type: string
    format: date-time
  participantsCount:
    type: integer
    format: int32
required:
  - timeSlotServiceId
  - capacity
  - datetime
  - serviceTypeId
  - id
  - serviceName
  - participantsCount
example:
  id: 1
  timeSlotServiceId: 1
  capacity: 20
  datetime: '2024-03-20T09:00:00Z'
  participantsCount: 10
