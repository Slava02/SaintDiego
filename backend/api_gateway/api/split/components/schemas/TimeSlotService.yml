type: object
properties:
  id:
    type: integer
    format: int64
  serviceTypeId:
    type: integer
    format: int64
  capacity:
    type: integer
    format: int32
  bookingWindow:
    type: integer
    format: int32
  time:
    type: string
    format: date-time
required:
  - serviceTypeId
  - capacity
  - bookingWindow
  - time
example:
  serviceTypeId: 1
  capacity: 20
  bookingWindow: 30
  time: '2024-03-20T09:00:00Z'
