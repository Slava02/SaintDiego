type: object
properties:
  id:
    type: integer
    format: int64
  first_name:
    type: string
  middle_name:
    type: string
  last_name:
    type: string
  is_homeless:
    type: boolean
  photo_name:
    type: string
  birth_date:
    type: string
    format: date-time
  gender:
    type: integer
    format: int32
  is_new:
    type: boolean
  is_blocked:
    type: boolean
  blocked_at:
    type: string
    format: date-time
  blocked_reason:
    type: string
required:
  - id
  - first_name
  - middle_name
  - last_name
  - is_new
example:
  id: 1
  first_name: Иван
  middle_name: Иванович
  last_name: Иванов
  is_homeless: true
  photo_name: photo.jpg
