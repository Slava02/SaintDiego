openapi: 3.0.0
info:
  title: Saint Egidio Admin API
  description: API для управления временными слотами, локациями и услугами в административной панели Saint Egidio
  version: 1.0.0
servers:
  - url: http://localhost:8080/v1
    description: Development server
paths:
  /locations:
    get:
      summary: Получение списка локаций
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
                maxItems: 100
        "401":
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "UNAUTHORIZED"
                message: "Необходима авторизация"
                details: "Требуется валидный JWT токен"
        "403":
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "FORBIDDEN"
                message: "Нет доступа к ресурсу"
                details: "У пользователя недостаточно прав"

    post:
      summary: Создание новой локации
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationRequest"
        required: true
      responses:
        "201":
          description: Локация успешно создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
              example:
                id: 3
                name: "Новый храм"
                address: "ул. Новая, 67"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "VALIDATION_ERROR"
                message: "Ошибка валидации"
                details: "Поле 'name' обязательно для заполнения"
        "401":
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "UNAUTHORIZED"
                message: "Необходима авторизация"
                details: "Требуется валидный JWT токен"
        "403":
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "FORBIDDEN"
                message: "Нет доступа к ресурсу"
                details: "У пользователя недостаточно прав"

  /services:
    get:
      summary: Получение списка услуг
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceType"
                maxItems: 100
        "401":
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "UNAUTHORIZED"
                message: "Необходима авторизация"
                details: "Требуется валидный JWT токен"
        "403":
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "FORBIDDEN"
                message: "Нет доступа к ресурсу"
                details: "У пользователя недостаточно прав"

  /services/{id}:
    get:
      summary: Получение информации об услуге по идентификатору
      parameters:
        - name: id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceType"
              example:
                id: 1
                name: "Исповедь"

  /timeSlots:
    get:
      summary: Получение списка временных слотов
      description: Возвращает список временных слотов с возможностью фильтрации
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: string
            enum:
              - "active"
              - "archived"
        - name: startDate
          in: query
          style: form
          explode: true
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          style: form
          explode: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeSlot"
                maxItems: 100
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "UNAUTHORIZED"
                message: "Необходима авторизация"
                details: "Требуется валидный JWT токен"
        "403":
          description: Not access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "FORBIDDEN"
                message: "Нет доступа к ресурсу"
                details: "У пользователя недостаточно прав"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "INTERNAL_ERROR"
                message: "Внутренняя ошибка сервера"
                details: "Произошла ошибка при обработке запроса"

    post:
      summary: Создание нового временного слота
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTimeSlotRequest"
        required: true
      responses:
        "201":
          description: Временной слот успешно создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSlot"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "VALIDATION_ERROR"
                message: "Ошибка валидации"
                details: "Поле 'title' обязательно для заполнения"
        "401":
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "UNAUTHORIZED"
                message: "Необходима авторизация"
                details: "Требуется валидный JWT токен"
        "403":
          description: Нет доступа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "FORBIDDEN"
                message: "Нет доступа к ресурсу"
                details: "У пользователя недостаточно прав"

  /timeSlots/{id}:
    get:
      summary: Получение временного слота по идентификатору
      parameters:
        - name: id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Временной слот
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSlot"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "VALIDATION_ERROR"
                message: "Ошибка валидации"
                details: "Неверный формат идентификатора"
        "404":
          description: Временной слот не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "NOT_FOUND"
                message: "Временной слот не найден"
                details: "Слот с ID 999 не существует"

    put:
      summary: Обновление временного слота
      parameters:
        - name: id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeSlot"
        required: true
      responses:
        "200":
          description: Временной слот успешно обновлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSlot"
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "VALIDATION_ERROR"
                message: "Ошибка валидации"
                details: "Поле 'title' обязательно для заполнения"
        "404":
          description: Временной слот не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "NOT_FOUND"
                message: "Временной слот не найден"
                details: "Слот с ID 999 не существует"

    delete:
      summary: Удаление временного слота
      parameters:
        - name: id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Временной слот успешно удален
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "404":
          description: Временной слот не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "NOT_FOUND"
                message: "Временной слот не найден"
                details: "Слот с ID 999 не существует"

  /timeSlots/{id}/activate:
    patch:
      summary: Активация временного слота
      parameters:
        - name: id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Временной слот успешно активирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSlot"
        "404":
          description: Временной слот не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "NOT_FOUND"
                message: "Временной слот не найден"
                details: "Слот с ID 999 не существует"

  /timeSlots/{id}/archive:
    patch:
      summary: Архивация временного слота
      parameters:
        - name: id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Временной слот успешно архивирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSlot"

        "404":
          description: Временной слот не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "NOT_FOUND"
                message: "Временной слот не найден"
                details: "Слот с ID 999 не существует"

  /events/current:
    get:
      summary: Получение списка событий
      description: Возвращает список событий, которые проходят в данный момент
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "401":
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /events/past:
    get:
      summary: Получение списка событий
      description: Возвращает список событий, которые прошли
      responses:
        "200":
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "401":
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
security:
  - BearerAuth: []

components:
  schemas:
    CreateLocationRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
      required:
        - name
        - address
      example:
        name: "Новый храм"
        address: "ул. Новая, 67"
    CreateTimeSlotRequest:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
          enum:
            - "single"
            - "recurring"
        locationId:
          type: integer
          format: int64
        capacity:
          type: integer
          format: int32
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        services:
          type: array
          items:
            $ref: "#/components/schemas/TimeSlotService"
        recurrence:
          $ref: "#/components/schemas/Recurrence"
      required:
        - title
        - type
        - locationId
        - capacity
        - startDate
        - endDate
        - services
      example:
        title: "Вечерняя служба"
        type: "recurring"
        locationId: 1
        capacity: 100
        startDate: "2024-03-20T18:00:00Z"
        endDate: "2024-03-20T19:00:00Z"
        services:
          - timeSlotId: 1
            serviceTypeId: 1
            capacity: 40
            bookingWindow: 30
            time: "2024-03-20T18:00:00Z"
          - timeSlotId: 1
            serviceTypeId: 2
            capacity: 60
            bookingWindow: 30
            time: "2024-03-20T18:30:00Z"
        recurrence:
          frequency: "weekly"
          interval: 1
          endType: "date"
          endValue: "2024-04-20T19:00:00Z"
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: string
      required:
        - code
        - message
      example:
        code: "VALIDATION_ERROR"
        message: "Ошибка валидации"
        details: "Поле 'name' обязательно для заполнения"
    Location:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        address:
          type: string
      required:
        - id
        - name
      example:
        id: 1
        name: "Главный храм"
        address: "ул. Примерная, 123"
    Recurrence:
      type: object
      properties:
        frequency:
          type: string
          enum:
            - "daily"
            - "weekly"
            - "monthly"
        interval:
          type: integer
          format: int32
          minimum: 1
        endType:
          type: string
          enum:
            - "never"
            - "date"
        endValue:
          type: string
          format: date-time
          nullable: true
      required:
        - frequency
        - interval
        - endType
      example:
        frequency: "weekly"
        interval: 1
        endType: "date"
        endValue: "2024-04-20T19:00:00Z"
    ServiceType:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      required:
        - id
        - name
      example:
        id: 1
        name: "Исповедь"
    TimeSlot:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        type:
          type: string
          enum:
            - "single"
            - "recurring"
        locationId:
          type: integer
          format: int64
        capacity:
          type: integer
          format: int32
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - "active"
            - "archived"
        services:
          type: array
          items:
            $ref: "#/components/schemas/TimeSlotService"
        recurrence:
          $ref: "#/components/schemas/Recurrence"
      required:
        - id
        - title
        - type
        - locationId
        - capacity
        - startDate
        - endDate
        - status
        - services
      example:
        id: 1
        title: "Утренняя служба"
        type: "single"
        locationId: 1
        capacity: 50
        startDate: "2024-03-20T09:00:00Z"
        endDate: "2024-03-20T10:00:00Z"
        status: "active"
        services:
          - timeSlotId: 1
            serviceTypeId: 1
            capacity: 20
            bookingWindow: 30
            time: "2024-03-20T09:00:00Z"
          - timeSlotId: 1
            serviceTypeId: 2
            capacity: 30
            bookingWindow: 30
            time: "2024-03-20T09:30:00Z"
    TimeSlotService:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serviceTypeId:
          type: integer
          format: int64
        capacity:
          type: integer
          format: int32
        bookingWindow:
          type: integer
          format: int32
        time:
          type: string
          format: date-time
      required:
        - serviceTypeId
        - capacity
        - bookingWindow
        - time
      example:
        serviceTypeId: 1
        capacity: 20
        bookingWindow: 30
        time: "2024-03-20T09:00:00Z"
    Event:
      type: object
      properties:
        id:
          type: integer
          format: int64
        timeSlotServiceId:
          type: integer
          format: int64
        capacity:
          type: integer
          format: int32
        datetime:
          type: string
          format: date-time
      required:
        - timeSlotServiceId
        - capacity
        - datetime
      example:
        id: 1
        timeSlotServiceId: 1
        capacity: 20
        datetime: "2024-03-20T09:00:00Z"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
