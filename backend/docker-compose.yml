version: '3.8'

services:
  api_gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - jaeger
      - events
    restart: on-failure

  schedule:
    build:
      context: ./schedule
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    depends_on:
      - jaeger
    restart: on-failure
  services:
    build:
      context: ./services
      dockerfile: Dockerfile
    ports:
      - "50052:50052"
    depends_on:
      - jaeger
    restart: on-failure
  events:
    build:
      context: ./events
      dockerfile: Dockerfile
    ports:
      - "50053:50053"
    depends_on:
      - jaeger
    restart: on-failure
  jaeger:
    image: jaegertracing/all-in-one:1.48
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "9411:9411"


