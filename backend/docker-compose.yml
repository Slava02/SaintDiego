services:
  api_gateway:
    container_name: api
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
      args:
        CONFIG_PATH: configs/config.docker.toml
    ports:
      - "8080:8080"
    depends_on:
      - jaeger
      - events
    restart: on-failure
    volumes:
      - go-mod-cache:/go/pkg/mod
    networks:
      - saint_egidio_network

  schedule:
    container_name: schedule
    build:
      context: ./schedule
      dockerfile: Dockerfile
      args:
        CONFIG_PATH: configs/config.docker.toml
    ports:
      - "50051:50051"
    depends_on:
      - jaeger
    restart: on-failure
    volumes:
      - go-mod-cache:/go/pkg/mod
    networks:
      - saint_egidio_network

  services:
    container_name: services
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        CONFIG_PATH: configs/config.docker.toml
    ports:
      - "50052:50052"
    depends_on:
      - jaeger
    restart: on-failure
    volumes:
      - go-mod-cache:/go/pkg/mod
    networks:
      - saint_egidio_network

  events:
    container_name: events
    build:
      context: ./events
      dockerfile: Dockerfile
      args:
        CONFIG_PATH: configs/config.docker.toml
    ports:
      - "50053:50053"
    depends_on:
      - jaeger
    restart: on-failure
    volumes:
      - go-mod-cache:/go/pkg/mod
    networks:
      - saint_egidio_network

  auth:
    container_name: auth
    build:
      context: ./auth
      dockerfile: Dockerfile
      args:
        CONFIG_PATH: configs/config.docker.toml
    ports:
      - "50056:50056"
    depends_on:
      - jaeger
    restart: on-failure
    volumes:
      - go-mod-cache:/go/pkg/mod
    networks:
      - saint_egidio_network

  clients:
    container_name: clients
    build:
      context: ./clients
      dockerfile: Dockerfile
      args:
        CONFIG_PATH: configs/config.docker.toml
    ports:
      - "50055:50055"
    depends_on:
      - jaeger
    restart: on-failure
    volumes:
      - go-mod-cache:/go/pkg/mod
    networks:
      - saint_egidio_network

  volunteers:
    container_name: volunteers
    build:
      context: ./volunteers
      dockerfile: Dockerfile
      args:
        CONFIG_PATH: configs/config.docker.toml
    ports:
      - "50054:50054"
    depends_on:
      - jaeger
    restart: on-failure
    volumes:
      - go-mod-cache:/go/pkg/mod
    networks:
      - saint_egidio_network

  jaeger:
    image: jaegertracing/all-in-one:1.48
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "9411:9411"
    networks:
      - saint_egidio_network

volumes:
  go-mod-cache:

networks:
  saint_egidio_network:
    external: true
    name: saint_egidio_network


