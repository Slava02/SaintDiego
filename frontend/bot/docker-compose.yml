services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: saint_egidio_bot:latest
    container_name: saint_egidio_bot
    restart: unless-stopped
    env_file:
      - path: ./docker.env
        required: true
    working_dir: /app
    volumes:
      - ./:/app:ro
    networks:
      - default
      - backend_network
    command: ["python3", "-u", "main.py"]

networks:
  backend_network:
    external: true
    name: backend_default
  default:
    driver: bridge
