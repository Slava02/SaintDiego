version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: saint_egidio_bot:latest
    container_name: saint_egidio_bot
    restart: unless-stopped
    env_file:
      - ./env
    working_dir: /app
    volumes:
      - ./:/app:ro
    command: ["python3", "-u", "main.py"]
